<!doctype html>
<html lang="pt-BR" class="theme-dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REA Chat</title>
<link rel="stylesheet" href="/style.css" />
<link rel="icon" href="/favicon.svg" />
</head>
<body>
<div id="app-mount">
<div id="boot-splash">
  <div class="splash-inner">
    <video autoplay muted loop playsinline id="boot-video" width="200" height="200">
      <source src="/splash/connecting.webm" type="video/webm" />
    </video>
    <div class="splash-text">
      <span class="splash-status" id="boot-status">Checking for updates...</span>
      <div class="progress-placeholder">&nbsp;</div>
    </div>
  </div>
</div>

<div class="login-screen" id="login">
  <div class="login-card">
    <div class="login-logo">REA</div>
    <h1 class="login-title">Bem-vindo de volta!</h1>
    <p class="login-sub">Estamos muito felizes em ver voce de novo.</p>
    <form id="login-form" autocomplete="off">
      <label class="field-label" for="username">Nome de usuario</label>
      <input id="username" name="username" maxlength="32" placeholder="Como devemos te chamar?" required />
      <div class="login-error" id="login-error" hidden></div>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
    <div class="login-tools" id="login-tools">Conectando ao servidor...</div>
  </div>
</div>

<div class="app" id="app" hidden>

  <nav class="guilds">
    <div class="guild-list" id="guild-list"></div>
    <button class="guild-pill guild-add" id="add-guild" title="Criar servidor">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"/></svg>
    </button>
    <div class="guild-sep"></div>
    <button class="guild-pill guild-dm" id="open-dm-list" title="Mensagens diretas">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2z"/></svg>
    </button>
  </nav>

  <aside class="sidebar">
    <header class="sidebar-header">
      <span id="guild-name">REA Server</span>
      <button class="icon-btn" id="guild-settings" title="Configuracoes do servidor">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M13.3 9.9a1 1 0 0 0 .2 1.1l.1.1a1.2 1.2 0 1 1-1.7 1.7l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9v.2a1.2 1.2 0 1 1-2.4 0v-.1a1 1 0 0 0-.6-1 1 1 0 0 0-1.1.2l-.1.1a1.2 1.2 0 1 1-1.7-1.7l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a1.2 1.2 0 1 1 0-2.4h.1a1 1 0 0 0 1-.6 1 1 0 0 0-.2-1.1l-.1-.1a1.2 1.2 0 1 1 1.7-1.7l.1.1a1 1 0 0 0 1.1.2H8a1 1 0 0 0 .6-.9V4a1.2 1.2 0 1 1 2.4 0v.1a1 1 0 0 0 .6 1 1 1 0 0 0 1.1-.2l.1-.1a1.2 1.2 0 1 1 1.7 1.7l-.1.1a1 1 0 0 0-.2 1.1V8a1 1 0 0 0 .9.6h.2a1.2 1.2 0 1 1 0 2.4h-.1a1 1 0 0 0-1 .6z"/></svg>
      </button>
    </header>
    <div class="sidebar-scroll" id="channel-list"></div>
    <footer class="user-bar">
      <div class="user-bar-me" id="me-block">
        <div class="avatar avatar-sm" id="me-avatar">?</div>
        <div class="user-bar-text">
          <span class="user-bar-name" id="me-name">—</span>
          <span class="user-bar-tag" id="me-tag">#0000</span>
        </div>
      </div>
      <div class="user-bar-actions">
        <button class="icon-btn" id="btn-status" title="Status">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Configuracoes">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/><path d="M13.3 9.9a1 1 0 0 0 .2 1.1l.1.1a1.2 1.2 0 1 1-1.7 1.7l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9v.2a1.2 1.2 0 1 1-2.4 0v-.1a1 1 0 0 0-.6-1 1 1 0 0 0-1.1.2l-.1.1a1.2 1.2 0 1 1-1.7-1.7l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4a1.2 1.2 0 1 1 0-2.4h.1a1 1 0 0 0 1-.6 1 1 0 0 0-.2-1.1l-.1-.1a1.2 1.2 0 1 1 1.7-1.7l.1.1a1 1 0 0 0 1.1.2H8a1 1 0 0 0 .6-.9V4a1.2 1.2 0 1 1 2.4 0v.1a1 1 0 0 0 .6 1 1 1 0 0 0 1.1-.2l.1-.1a1.2 1.2 0 1 1 1.7 1.7l-.1.1a1 1 0 0 0-.2 1.1V8a1 1 0 0 0 .9.6h.2a1.2 1.2 0 1 1 0 2.4h-.1a1 1 0 0 0-1 .6z"/></svg>
        </button>
      </div>
    </footer>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <div class="chat-header-left">
        <span class="channel-hash" id="channel-icon">#</span>
        <span class="chat-title" id="channel-name">selecione um canal</span>
        <span class="chat-topic" id="channel-topic"></span>
      </div>
      <div class="chat-header-right">
        <button class="icon-btn" id="btn-call" title="Iniciar chamada de voz">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 2.8c.4-.4 1-.4 1.4 0l3.2 3.2c.4.4.4 1 0 1.4L9.7 8.9c-.2.2-.3.5-.2.8.9 2.1 2.6 3.8 4.7 4.7.3.1.6 0 .8-.2l1.5-1.5c.4-.4 1-.4 1.4 0l3.2 3.2c.4.4.4 1 0 1.4l-1.6 1.6c-1 1-2.5 1.3-3.8.8-5-1.9-9-5.9-10.9-10.9-.5-1.3-.2-2.8.8-3.8l1.6-1.6z"/></svg>
        </button>
        <button class="icon-btn" id="btn-members" title="Mostrar membros">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7.5 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3.3 3.1-6 7-6s7 2.7 7 6H2zm14.5-5c2.5.4 4.5 2.4 4.5 5h-4.2c0-1.9-.7-3.6-1.9-4.9.5-.1 1.1-.1 1.6-.1z"/></svg>
        </button>
        <div class="search-box">
          <input class="search-input" id="search-input" placeholder="Buscar" />
        </div>
      </div>
    </header>

    <div class="voice-stage" id="voice-stage" hidden>
      <div class="voice-stage-head">
        <span class="voice-stage-title" id="voice-stage-title">Chamada de voz</span>
        <div class="voice-controls">
          <button class="voice-btn" id="btn-mic" title="Mudo (Ctrl+Shift+M)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></svg>
          </button>
          <button class="voice-btn" id="btn-deafen" title="Ensurdecer">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a8 8 0 0 0-8 8v3a3 3 0 0 0 3 3h1v-8H6v-1a6 6 0 1 1 12 0v1h-2v8h1a3 3 0 0 0 3-3v-3a8 8 0 0 0-8-8z"/></svg>
          </button>
          <button class="voice-btn" id="btn-camera" title="Camera">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          </button>
          <button class="voice-btn" id="btn-screen" title="Compartilhar tela">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-7v2h3v2H7v-2h3v-2H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 2v9h16V6H4z"/></svg>
          </button>
          <button class="voice-btn voice-btn-leave" id="btn-voice-leave" title="Desconectar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 2.8c.4-.4 1-.4 1.4 0l3.2 3.2c.4.4.4 1 0 1.4L9.7 8.9c-.2.2-.3.5-.2.8.9 2.1 2.6 3.8 4.7 4.7.3.1.6 0 .8-.2l1.5-1.5c.4-.4 1-.4 1.4 0l3.2 3.2c.4.4.4 1 0 1.4l-1.6 1.6c-1 1-2.5 1.3-3.8.8-5-1.9-9-5.9-10.9-10.9-.5-1.3-.2-2.8.8-3.8l1.6-1.6z"/><path d="M2 2l20 20" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
      </div>
      <div class="voice-tiles" id="voice-tiles"></div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="typing" id="typing"></div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-reply" id="composer-reply" hidden>
        <span id="composer-reply-text"></span>
        <button type="button" class="icon-btn" id="cancel-reply">✕</button>
      </div>
      <div class="composer-attachments" id="composer-attachments" hidden></div>
      <div class="composer-row">
        <button type="button" class="composer-plus" id="btn-attach" title="Anexar arquivo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a1 1 0 0 1 1 1v7h7a1 1 0 1 1 0 2h-7v7a1 1 0 1 1-2 0v-7H4a1 1 0 1 1 0-2h7V4a1 1 0 0 1 1-1z"/></svg>
        </button>
        <input type="file" id="file-input" multiple hidden />
        <textarea id="input" rows="1" placeholder="Enviar mensagem em #geral" maxlength="8000"></textarea>
        <button type="submit" class="btn-send" title="Enviar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 2.3a1 1 0 0 1 .2 1.1l-7 18a1 1 0 0 1-1.9-.1l-2.2-7.2-7.2-2.2a1 1 0 0 1-.1-1.9l18-7a1 1 0 0 1 1.2.3zM11 13.6l1.6 5.2 4.9-12.6L11 13.6z"/></svg>
        </button>
      </div>
      <div class="composer-hint">Enter para enviar · Shift+Enter para nova linha · Comece com / para comandos REA</div>
    </form>
  </main>

  <aside class="members" id="members-panel">
    <div class="members-header">
      <span id="online-count">Online 0</span>
      <button class="icon-btn" id="close-members">✕</button>
    </div>
    <div class="members-scroll" id="member-list"></div>
  </aside>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" id="modal-body"></div>
</div>

<div class="toast" id="toast" hidden></div>

</div>
<script type="module" src="/app.js"></script>
</body>
</html>
